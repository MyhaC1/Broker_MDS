name: CI

# Принято из предложения зоны `deploy` (OPS-18, Р-077) с четырьмя правками
# зоны `mds` — они названы по месту ниже и разобраны в отчёте MDS-07.
#
# ТРИГГЕР: пуш в ЛЮБУЮ ветку. Каталога .github здесь не существовало вовсе,
# и именно в этой зоне смоук был красным месяц — он честно печатал отказ, но
# его никто не запускал. Красный, которого не смотрят, равен зелёному.
# Фильтра ветвей нет сознательно: узор `cms` и терминала (`branches: [main]`)
# содержит ровно тот дефект, ради которого писалась OPS-14.
on:
  push:
  pull_request:

# Пуш в ветку и PR из неё же попадают в одну группу — иначе одна правка
# гоняет CI дважды.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # версия берётся из packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsconfig.test.json заведён зоной mds 19.10 и уже поймал настоящую
      # ошибку модели и ссылку на несуществующий тест-файл. Команда
      # `pnpm typecheck` зовёт ОБА конфига.
      - name: Typecheck (обе конфигурации, включая тестовый код)
        run: pnpm typecheck

      # QA-04: прогон зовёт КОМАНДУ ПРОЕКТА, а не шаблон пути. Что считается
      # прогоном, знает один файл — package.json. У терминала одиннадцать
      # свежих проверок не запускались бы, потому что CI звал тесты путём.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # --- Смоук: контрактная половина, БЕЗ живой биржи ------------------
      #
      # Это та половина, в которой жил месячный дефект: MDS-03 убрала поле
      # `status` у провайдера, а смоук продолжал его сверять. Проверка формы
      # нашего собственного ответа от Binance не зависит ничем — и потому
      # блокирует, а не помечается неблокирующей.
      - name: Поднять поддельный апстрим и MDS
        run: |
          set -euo pipefail
          test -f scripts/fake-binance.mjs || {
            echo "ПРОВАЛ: нет scripts/fake-binance.mjs — контрактный смоук НЕ ВЫПОЛНЕН," >&2
            echo "        результат неизвестен." >&2
            exit 1
          }

          # ПРАВКА 1 к предложению: порт 18765, а не 19443. На машине
          # разработчика 19443 попадает в зарезервированный Windows диапазон
          # и даёт EACCES — ручной прогон того же файла не поднимался бы.

          # ПРАВКА 2, главная: подменяется НЕ ТОЛЬКО WS, но и REST.
          # Вселенную MDS берёт по HTTP из BINANCE_API_URL — это ОТДЕЛЬНАЯ
          # переменная. Подменив один BINANCE_WS_URL, «половина без чужой
          # сети» всё равно ходила бы в api.binance.com за каталогом.
          node scripts/fake-binance.mjs > /tmp/fake.log 2>&1 & echo $! > /tmp/fake.pid

          # ПРАВКА 3: секрет ручки ГЕНЕРИРУЕТСЯ здесь и ASCII.
          # (а) Секрет репозитория для этого не нужен вовсе: обе стороны —
          #     и MDS, и смоук — поднимает этот же job, сверять не с чем
          #     внешним. Вопрос владельцу про `MDS_ADMIN_TOKEN` снимается.
          # (б) Запасное значение из предложения содержало кириллицу, а MDS
          #     непередаваемый в HTTP-заголовке секрет отвергает и выключает
          #     ручку целиком — проверка «ручка с секретом» краснела бы не
          #     по делу. Проверено живым прогоном, см. MDS-07.
          TOKEN="ci-$(openssl rand -hex 16)"
          echo "MDS_ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          QUOTE_STALE_AFTER_MS=60000 \
          BINANCE_WS_URL=ws://127.0.0.1:18765 \
          BINANCE_API_URL=http://127.0.0.1:18765 \
          MDS_REGISTRY_PATH=/tmp/mds-ci-registry.json \
          MDS_ADMIN_TOKEN="$TOKEN" \
          PORT=3003 \
          node dist/index.js > /tmp/mds.log 2>&1 & echo $! > /tmp/mds.pid

          # ПРАВКА 4: ждём ЛЮБОГО ответа, а не только 200. `/health` при
          # деградации отвечает 503, и `curl -fsS` на нём падает — вместо
          # диагноза получился бы молчаливый отказ шага. Судит смоук, у него
          # проверки названы поимённо.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/health || true)
            [ "$code" = "200" ] || [ "$code" = "503" ] && break
            sleep 1
          done
          echo "--- /health перед смоуком ---"
          curl -s http://127.0.0.1:3003/health | head -c 2000; echo

      - name: Смоук — контрактная половина
        env:
          MDS_URL: http://127.0.0.1:3003
          MDS_SMOKE_MODE: contract
        run: |
          set +e
          node scripts/smoke.mjs
          code=$?
          set -e
          # Исходов три, и у каждого свой смысл. «Не сошлось» и «не смотрели»
          # одним числом — это ложь кодом возврата.
          case "$code" in
            0) echo "Контрактная половина пройдена целиком." ;;
            1) echo "ПРОВАЛ: расхождение контракта." >&2; exit 1 ;;
            3) echo "ПРОВАЛ: часть проверок НЕ ВЫПОЛНЕНА — результат неизвестен, а не успех." >&2; exit 1 ;;
            *) echo "ПРОВАЛ: смоук завершился кодом $code — это не результат проверок." >&2; exit 1 ;;
          esac

      # Логи поднятого — БЕЗУСЛОВНО и наружу. Вывод этих двух процессов уведён
      # в файлы не ради тишины, а потому что фоновый процесс, держащий stdout
      # шага, не даёт шагу завершиться: проверено локальным прогоном этих же
      # строк — он повис на 10 минут вместо того, чтобы упасть или пройти.
      # Зависание списывают на «что-то долго», красный шаг чинят. Но
      # подавленная диагностика дороже шумной, поэтому логи печатаются здесь.
      - name: Логи поднятого
        if: always()
        run: |
          for f in /tmp/mds.log /tmp/fake.log; do
            echo "===== $f ====="
            tail -c 4000 "$f" 2>/dev/null || echo "(файла нет)"
          done

      # Снимаем ПО ИМЕНИ и БЕЗУСЛОВНО. `timeout` убивает CLI, а не процесс —
      # на этом мы уже дважды теряли время на конкурирующем потребителе.
      - name: Снять поднятое
        if: always()
        run: |
          for p in /tmp/mds.pid /tmp/fake.pid; do
            [ -f "$p" ] && kill "$(cat "$p")" 2>/dev/null || true
          done
          wait 2>/dev/null || true
